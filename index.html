            const [isTableModalOpen, setIsTableModalOpen] = useState(false);
            const [isBulkAddModalOpen, setIsBulkAddModalOpen] = useState(false);
            const [isNewWeddingModalOpen, setIsNewWeddingModalOpen] = useState(false);
            
            const [modalInputName, setModalInputName] = useState("");
            const [bulkGuestsInput, setBulkGuestsInput] = useState("");
            const [editingGuest, setEditingGuest] = useState(null);
            
            const [newWeddingData, setNewWeddingData] = useState({ code: "", p1: "", p2: "", venue: "shotton", date: "" });

            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [hasSigned, setHasSigned] = useState(false);

            useEffect(() => {
                const savedDB = localStorage.getItem('weddingPlannerDB');
                if (savedDB) {
                    try {
                        const parsed = JSON.parse(savedDB);
                        setDb(Array.isArray(parsed) ? parsed : []);
                    } catch (e) {
                        setDb([]);
                    }
                } else {
                    const demoWedding = { ...DEFAULT_WEDDING, id: "love2025", accessCode: "love2025", eventDetails: { ...DEFAULT_WEDDING.eventDetails, partner1: "Sarah", partner2: "James", venue: "shotton" } };
                    setDb([demoWedding]);
                    localStorage.setItem('weddingPlannerDB', JSON.stringify([demoWedding]));
                }
            }, []);

            const stats = useMemo(() => {
                const safeGuests = Array.isArray(guests) ? guests : [];
                const attendingGuests = safeGuests.filter(g => g.rsvp === 'attending');
                const countCourse = (courseKey) => {
                    const counts = {};
                    attendingGuests.forEach(g => { if (g[courseKey]) counts[g[courseKey]] = (counts[g[courseKey]] || 0) + 1; });
                    return counts;
                };
                const dietaryGuests = attendingGuests.filter(g => (g.dietary && g.dietary.trim() !== '') || g.isVegan);
                
                let daysToDeadline = 0;
                let deadlineDateStr = "";
                
                if (eventDetails.date) {
                    const wDate = new Date(eventDetails.date);
                    // 14 days before wedding date
                    const deadlineDate = new Date(wDate);
                    deadlineDate.setDate(wDate.getDate() - 14);
                    
                    const today = new Date();
                    daysToDeadline = Math.ceil((deadlineDate - today) / (1000 * 60 * 60 * 24));
                    deadlineDateStr = deadlineDate.toLocaleDateString();
                }
                
                return { starters: countCourse('starter'), mains: countCourse('main'), desserts: countCourse('dessert'), dietary: dietaryGuests, daysToDeadline: daysToDeadline, deadlineDateStr: deadlineDateStr };
            }, [guests, eventDetails.date]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (accessCode === 'Mcnadmin') {
                    setIsAdmin(true);
                    setView('adminDashboard');
                } else {
                    const wedding = db.find(w => w.accessCode === accessCode);
                    if (wedding) {
                        loadWedding(wedding);
                        setIsAdmin(false);
                    } else {
                        alert("Invalid Access Code. Please try again.");
                    }
                }
            };

            const loadWedding = (wedding) => {
                if (!wedding) return;
                setCurrentEventId(wedding.id);
                setEventDetails(wedding.eventDetails || DEFAULT_WEDDING.eventDetails);
                setGuests(Array.isArray(wedding.guests) ? wedding.guests : []);
                setTables(wedding.tables || []);
                setMenuSelections(wedding.menuSelections || DEFAULT_WEDDING.menuSelections);
                setView('menu'); 
            };

            // --- CRITICAL FIX: Direct Database Update Logic ---
            const updateWeddingData = (updates) => {
                if (!currentEventId) return;

                setDb(prevDb => {
                    const oldWedding = prevDb.find(w => w.id === currentEventId);
                    if (!oldWedding) return prevDb;
                    
                    const newWedding = { 
                        ...oldWedding, 
                        guests: updates.guests !== undefined ? updates.guests : oldWedding.guests,
                        tables: updates.tables !== undefined ? updates.tables : oldWedding.tables,
                        menuSelections: updates.menuSelections !== undefined ? updates.menuSelections : oldWedding.menuSelections,
                        eventDetails: updates.eventDetails !== undefined ? updates.eventDetails : oldWedding.eventDetails
                    };
                    
                    // Update Local State immediately based on the NEW data structure
                    if (updates.guests !== undefined) setGuests(updates.guests);
                    if (updates.tables !== undefined) setTables(updates.tables);
                    if (updates.menuSelections !== undefined) setMenuSelections(updates.menuSelections);
                    if (updates.eventDetails !== undefined) setEventDetails(updates.eventDetails);

                    const newDb = prevDb.map(w => w.id === currentEventId ? newWedding : w);
                    localStorage.setItem('weddingPlannerDB', JSON.stringify(newDb));
                    return newDb;
                });
                
                setShowSaveNotification(true);
                setTimeout(() => setShowSaveNotification(false), 3000);
            };

            // Manual Save
            const saveCurrentEvent = () => {
                updateWeddingData({ guests, tables, menuSelections, eventDetails });
            };

            const createNewWedding = () => {
                if (!newWeddingData.code || !newWeddingData.p1 || !newWeddingData.p2) return;
                if (db.find(w => w.accessCode === newWeddingData.code)) {
                    alert("Access Code already exists. Please choose a unique one.");
                    return;
                }
                const newWedding = {
                    id: newWeddingData.code,
                    accessCode: newWeddingData.code,
                    guests: [],
                    tables: [{ id: 1, name: "Top Table", seats: 8, shape: "rect" }],
                    menuSelections: { canapes: [], starters: [], mains: [], desserts: [], eveningCategory: "", eveningPizzas: [], eveningSides: [], eveningStreetFood: [], kidsStarters: [], kidsMains: [], kidsDesserts: [] },
                    eventDetails: { partner1: newWeddingData.p1, partner2: newWeddingData.p2, date: newWeddingData.date || new Date().toISOString().split('T')[0], venue: newWeddingData.venue, isSubmitted: false, signature: null, submissionDate: null }
                };
                const newDb = [...db, newWedding];
                setDb(newDb);
                localStorage.setItem('weddingPlannerDB', JSON.stringify(newDb));
                setIsNewWeddingModalOpen(false);
                setNewWeddingData({ code: "", p1: "", p2: "", venue: "shotton", date: "" });
            };

            const deleteWedding = (id) => {
                if (confirm("Are you sure? This will delete the wedding and all data permanently.")) {
                    const newDb = db.filter(w => w.id !== id);
                    setDb(newDb);
                    localStorage.setItem('weddingPlannerDB', JSON.stringify(newDb));
                }
            };

            const toggleMenuSelection = (category, item, limit) => {
                let newSelections = { ...menuSelections };
                const current = newSelections[category] || [];
                if (current.includes(item)) {
                    newSelections[category] = current.filter(i => i !== item);
                } else {
                    if (current.length < limit) {
                        newSelections[category] = [...current, item];
                    } else {
                        alert(`You can only select ${limit} options for this course.`);
                        return;
                    }
                }
                updateWeddingData({ menuSelections: newSelections });
            };

            // Canvas Logic
            const startDrawing = (e) => {
                if (eventDetails.isSubmitted) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
                setIsDrawing(true); setHasSigned(true);
            };
            const draw = (e) => {
                if (!isDrawing || eventDetails.isSubmitted) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.lineTo(x, y); ctx.stroke();
            };
            const stopDrawing = () => setIsDrawing(false);
            const clearSignature = () => {
                if (eventDetails.isSubmitted) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                setHasSigned(false);
            };
            const handleSubmitNumbers = () => {
                if (!hasSigned) { alert("Please sign using the virtual signature pad."); return; }
                if (confirm("Confirm final submission? This will lock the event.")) {
                    const signatureData = canvasRef.current.toDataURL();
                    updateWeddingData({ eventDetails: { ...eventDetails, isSubmitted: true, signature: signatureData, submissionDate: new Date().toISOString() }});
                    setTimeout(saveCurrentEvent, 100); 
                }
            };

            // --- FIXED BULK ADD LOGIC ---
            const handleBulkAdd = () => {
                if (!bulkGuestsInput.trim()) return;
                // Robust split: handles Windows \r\n, Mac \r, Linux \n
                const names = bulkGuestsInput.split(/[\r\n]+/).map(n => n.trim()).filter(n => n);
                
                if (names.length === 0) return;

                const baseId = Date.now();
                const newG = names.map((n, i) => ({ 
                    id: baseId * 1000 + i, 
                    name: n, 
                    rsvp: "pending", 
                    isChild: false, 
                    isVegan: false, 
                    dietary: "", 
                    starter: "", 
                    main: "", 
                    dessert: "", 
                    tableId: null 
                }));
                
                // CRITICAL: Merge with the latest DB state, not just local state
                const storedDBRaw = localStorage.getItem('weddingPlannerDB');
                const storedDB = storedDBRaw ? JSON.parse(storedDBRaw) : [];
                const currentWedding = storedDB.find(w => w.id === currentEventId);
                const currentGuests = currentWedding ? (Array.isArray(currentWedding.guests) ? currentWedding.guests : []) : [];
                
                const updatedGuests = [...currentGuests, ...newG];
                
                // Save directly
                updateWeddingData({ guests: updatedGuests });
                
                setBulkGuestsInput(""); 
                setIsBulkAddModalOpen(false);
            };

            // --- FIXED SAVE GUEST LOGIC ---
            const saveGuest = () => {
                if (!editingGuest?.name) return;
                
                // CRITICAL: Fetch from DB source of truth
                const storedDBRaw = localStorage.getItem('weddingPlannerDB');
                const storedDB = storedDBRaw ? JSON.parse(storedDBRaw) : [];
                const currentWedding = storedDB.find(w => w.id === currentEventId);
                const currentGuests = currentWedding ? (Array.isArray(currentWedding.guests) ? currentWedding.guests : []) : [];

                let updatedGuests;
                if (editingGuest.id) {
                    updatedGuests = currentGuests.map(g => g.id === editingGuest.id ? editingGuest : g);
                } else {
                    updatedGuests = [...currentGuests, { ...editingGuest, id: Date.now() * 1000 }];
                }
                
                updateWeddingData({ guests: updatedGuests });
                
                setIsGuestModalOpen(false); 
                setEditingGuest(null);
            };

            const handleAddTable = () => {
                if (modalInputName.trim()) {
                    const newTables = [...tables, { id: Date.now(), name: modalInputName, seats: 8, shape: 'round' }];
                    updateWeddingData({ tables: newTables });
                    setModalInputName("");
                    setIsTableModalOpen(false);
                }
            };

            const exportCSV = () => {
                const safeGuests = Array.isArray(guests) ? guests : [];
                const headers = ["Name", "RSVP", "Starter", "Main", "Dessert", "Dietary", "Table", "Child", "Vegan"];
                const rows = safeGuests.map(g => [g.name, g.rsvp, g.starter || "", g.main || "", g.dessert || "", g.dietary || "", tables.find(t => t.id === g.tableId)?.name || "Unassigned", g.isChild ? "Yes" : "No", g.isVegan ? "Yes" : "No"]);
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => `"${e.join('","')}"`)].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "wedding_guest_list.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const NavItem = ({ id, label, icon: Icon }) => (
                <button onClick={() => { setView(id); setIsMobileMenuOpen(false); }} className={`flex items-center gap-3 px-4 py-3 w-full rounded-xl transition-colors ${view === id ? 'bg-rose-50 text-rose-600 font-medium' : 'text-stone-600 hover:bg-stone-50'}`}>
                    <Icon size={20} /><span>{label}</span>
                </button>
            );

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-stone-50 flex items-center justify-center p-4">
                        <div 
                            className="max-w-md w-full rounded-2xl shadow-xl overflow-hidden relative text-center border border-stone-200"
                            style={{ 
                                backgroundImage: "url('https://i.postimg.cc/4yMH9j3P/Chat_GPT_Image_Jan_14_2026_02_05_28_PM.png')", 
                                backgroundSize: 'cover', 
                                backgroundPosition: 'center' 
                            }}
                        >
                            {/* Overlay for readability */}
                            <div className="absolute inset-0 bg-white/90"></div>
                            
                            <div className="relative z-10 p-8">
                                {/* Header Content */}
                                <div className="w-16 h-16 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Heart className="text-rose-500" size={32} />
                                </div>
                                
                                <h2 className="text-sm font-bold tracking-widest text-stone-500 mb-2 uppercase">MCN COLLECTION</h2>
                                <h3 className="text-xs text-stone-400 mb-6 uppercase tracking-wide">Venues of excellence</h3>
                                
                                <h1 className="text-3xl font-serif text-stone-800 mb-2">Wedding Day Plan</h1>
                                <p className="text-stone-500 mb-8">Secure Event Portal</p>
                                
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <Input type="password" placeholder="Enter Access Code" value={accessCode} onChange={(e) => setAccessCode(e.target.value)} className="text-center text-lg tracking-widest bg-white/80 border-stone-300"/>
                                    <Button className="w-full justify-center py-3 shadow-lg" type="submit">Access Event</Button>
                                    <p className="text-xs text-stone-400 mt-4">Couples: Use your unique code.<br/>Staff: Enter Admin Key.</p>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'adminDashboard') {
                return (
                    <div className="min-h-screen bg-stone-100 font-sans text-stone-800">
                        <div className="bg-white border-b border-stone-200 px-8 py-4 flex justify-between items-center shadow-sm">
                            <div className="flex items-center gap-2"><Shield className="text-stone-800" size={24} /><h1 className="font-serif font-bold text-xl">Admin Dashboard</h1></div>
                            <div className="flex gap-3"><Button onClick={() => setIsNewWeddingModalOpen(true)} icon={Plus}>Add New Wedding</Button><Button variant="secondary" onClick={() => { setView('login'); setAccessCode(''); }} icon={LogOut}>Logout</Button></div>
                        </div>
                        <div className="p-8 max-w-6xl mx-auto">
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {db.map(wedding => (
                                    <Card key={wedding.id} className="p-6 relative group hover:shadow-md transition-shadow">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <h3 className="font-serif font-bold text-lg">{wedding.eventDetails.partner1} & {wedding.eventDetails.partner2}</h3>
                                                <p className="text-sm text-stone-500 flex items-center gap-1 mt-1"><Calendar size={14}/> {new Date(wedding.eventDetails.date).toLocaleDateString()}</p>
                                                <p className="text-sm text-stone-500 flex items-center gap-1"><Settings size={14}/> {MENUS[wedding.eventDetails.venue]?.name || wedding.eventDetails.venue}</p>
                                            </div>
                                            <div className="bg-stone-100 px-3 py-1 rounded-full text-xs font-mono font-bold text-stone-600 flex items-center gap-1"><Key size={12}/> {wedding.accessCode}</div>
                                        </div>
                                        <div className="flex justify-between items-center pt-4 border-t border-stone-100 mt-4">
                                            <div className="text-xs text-stone-400">{wedding.guests?.length || 0} Guests</div>
                                            <div className="flex gap-2"><button onClick={() => deleteWedding(wedding.id)} className="p-2 text-stone-400 hover:text-red-500 hover:bg-red-50 rounded"><Trash2 size={16}/></button><Button variant="secondary" className="text-xs px-3" onClick={() => loadWedding(wedding)}>Login as Couple</Button></div>
                                        </div>
                                    </Card>
                                ))}
                                {db.length === 0 && <div className="col-span-full text-center py-12 text-stone-400 bg-white rounded-xl border border-dashed border-stone-300">No weddings booked yet. Click "Add New Wedding" to start.</div>}
                            </div>
                        </div>
                        <Modal isOpen={isNewWeddingModalOpen} onClose={() => setIsNewWeddingModalOpen(false)} title="Book New Wedding">
                            <div className="space-y-4">
                                <Input label="Partner 1 Name" value={newWeddingData.p1} onChange={e => setNewWeddingData({...newWeddingData, p1: e.target.value})} placeholder="e.g. Sarah" />
                                <Input label="Partner 2 Name" value={newWeddingData.p2} onChange={e => setNewWeddingData({...newWeddingData, p2: e.target.value})} placeholder="e.g. James" />
                                <Input type="date" label="Wedding Date" value={newWeddingData.date} onChange={e => setNewWeddingData({...newWeddingData, date: e.target.value})} />
                                <Select label="Venue" value={newWeddingData.venue} onChange={e => setNewWeddingData({...newWeddingData, venue: e.target.value})}>
                                    <option value="shotton">Shotton Grange</option><option value="parlour">Parlour at Blagdon</option><option value="marshall">Marshall Meadows</option>
                                </Select>
                                <div className="bg-stone-50 p-4 rounded-lg border border-stone-200">
                                    <Input label="Generate Access Code" value={newWeddingData.code} onChange={e => setNewWeddingData({...newWeddingData, code: e.target.value})} placeholder="e.g. smith2026" />
                                    <p className="text-xs text-stone-500 mt-1">This is the code the couple will use to login.</p>
                                </div>
                                <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" onClick={() => setIsNewWeddingModalOpen(false)}>Cancel</Button><Button onClick={createNewWedding}>Create Wedding</Button></div>
                            </div>
                        </Modal>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-stone-50 flex font-sans text-stone-800">
                    <aside className={`hidden lg:flex flex-col w-64 bg-white border-r border-stone-200 h-screen sticky top-0`}>
                        <div className="relative p-6 border-b border-stone-100 overflow-hidden" style={eventDetails.venue === 'shotton' ? { backgroundImage: "url('https://i.postimg.cc/tC7nd3LH/Chat_GPT_Image_Jan_14_2026_03_05_19_PM.png')", backgroundSize: 'cover', backgroundPosition: 'center' } : {}}>
                            {eventDetails.venue === 'shotton' && <div className="absolute inset-0 bg-white/70 backdrop-blur-[1px] z-0"></div>}
                            <div className="relative z-10">
                                <div className="flex items-center gap-2 text-rose-500 mb-1"><Heart className="fill-current" size={24} /><span className="font-serif text-xl font-bold text-stone-800">{MENUS[eventDetails.venue]?.name}</span></div>
                                <p className="text-lg font-bold text-stone-700 ml-8 mt-2 font-serif">{eventDetails.partner1} & {eventDetails.partner2}</p>
                                {!eventDetails.isSubmitted && (
                                    <div className="ml-8 mt-1 flex items-center gap-1 text-xs text-rose-600 font-medium">
                                        <AlertCircle size={12} />
                                        <span>{stats.daysToDeadline} Days to Submit Final Numbers</span>
                                    </div>
                                )}
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-1">
                            <NavItem id="menu" label="Menu Options" icon={Utensils} />
                            <NavItem id="guests" label="Guest List" icon={Users} />
                            <NavItem id="seating" label="Seating Plan" icon={Table} />
                            <NavItem id="totals" label="Totals & Dietary" icon={ClipboardList} />
                            <NavItem id="settings" label="Settings" icon={Settings} />
                        </nav>
                        <div className="p-4 border-t border-stone-100 space-y-2">
                            {isAdmin && <div className="text-xs text-center text-rose-500 font-bold mb-2">LOGGED IN AS ADMIN</div>}
                            <button onClick={saveCurrentEvent} className="flex items-center gap-2 text-stone-600 hover:text-stone-800 px-4 py-2 w-full hover:bg-stone-50 rounded-lg transition-colors"><Save size={18} /> Save Changes</button>
                            <button onClick={() => { setView(isAdmin ? 'adminDashboard' : 'login'); if(!isAdmin) setCurrentEventId(null); }} className="flex items-center gap-2 text-stone-500 hover:text-stone-800 px-4 py-2 w-full hover:bg-stone-50 rounded-lg transition-colors"><LogOut size={18} /> {isAdmin ? 'Back to Admin' : 'Sign Out'}</button>
                        </div>
                    </aside>
                    <main className="flex-1 flex flex-col min-w-0">
                        <header className="lg:hidden bg-white border-b border-stone-200 p-4 sticky top-0 z-20 flex justify-between items-center shadow-sm">
                            <div className="flex items-center gap-2 text-rose-500"><Heart className="fill-current" size={20} /><span className="font-serif text-lg font-bold text-stone-800">{MENUS[eventDetails.venue]?.name}</span></div>
                            <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-stone-600">{isMobileMenuOpen ? <CloseIcon /> : <MenuIcon />}</button>
                        </header>
                        {isMobileMenuOpen && (
                            <div className="lg:hidden fixed inset-0 z-10 bg-white pt-20 px-4 pb-4 overflow-y-auto">
                                <nav className="space-y-2">
                                    <NavItem id="menu" label="Menu Options" icon={Utensils} />
                                    <NavItem id="guests" label="Guest List" icon={Users} />
                                    <NavItem id="seating" label="Seating Plan" icon={Table} />
                                    <NavItem id="totals" label="Totals & Dietary" icon={ClipboardList} />
                                    <NavItem id="settings" label="Settings" icon={Settings} />
                                    <div className="h-px bg-stone-100 my-4" />
                                    <button onClick={saveCurrentEvent} className="flex items-center gap-3 px-4 py-3 w-full text-stone-600 hover:bg-stone-50 rounded-lg"><Save size={20} /> Save Changes</button>
                                    <button onClick={() => { setView(isAdmin ? 'adminDashboard' : 'login'); if(!isAdmin) setCurrentEventId(null); }} className="flex items-center gap-3 px-4 py-3 w-full text-stone-600"><LogOut size={20} /> Sign Out</button>
                                </nav>
                            </div>
                        )}
                        <div className="flex-1 p-4 lg:p-8 overflow-y-auto">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                                <div>
                                    <h2 className="text-2xl font-serif font-bold text-stone-800 capitalize">{view === 'menu' ? 'Menu Configuration' : view.replace(/([A-Z])/g, ' $1').trim()}</h2>
                                    {view === 'menu' ? <p className="text-stone-500 text-sm">Select options to appear on your guests' menu cards.</p> : <div className="flex items-center gap-2 text-stone-500 text-sm mt-1"><Calendar size={14} className="text-rose-400"/><span>{new Date(eventDetails.date).toLocaleDateString()}</span><span className="w-1 h-1 bg-stone-300 rounded-full"></span><span className="text-rose-500 font-medium">{Math.ceil((new Date(eventDetails.date) - new Date()) / (1000 * 60 * 60 * 24))} Days to go!</span></div>}
                                </div>
                                {view === 'guests' && <div className="flex gap-2"><Button variant="outline" icon={Download} onClick={exportCSV}>Export CSV</Button><Button variant="outline" icon={FileText} onClick={() => setIsBulkAddModalOpen(true)}>Bulk Add</Button><Button icon={UserPlus} onClick={() => { setEditingGuest({ id: null, name: "", rsvp: "pending", starter: "", main: "", dessert: "", dietary: "", isChild: false, isVegan: false, tableId: null }); setIsGuestModalOpen(true); }}>Add Guest</Button></div>}
                            </div>
                            
                            {/* MENU VIEW */}
                            {view === 'menu' && (
                                <div className="space-y-6 max-w-4xl">
                                    {eventDetails.isSubmitted && <div className="bg-green-50 border border-green-200 text-green-800 p-4 rounded-lg flex items-center gap-3"><CheckCircle className="text-green-600" /><div><span className="font-bold">Menu Submitted</span><p className="text-xs mt-1">Submitted on {new Date(eventDetails.submissionDate).toLocaleDateString()}. Changes are locked.</p></div></div>}
                                    <Card className="p-6 bg-stone-50"><h3 className="font-serif font-bold text-xl mb-1 text-stone-700">{MENUS[eventDetails.venue]?.name}</h3><p className="text-sm text-stone-500">Venue selected by Admin</p></Card>
                                    
                                    {/* Dietary & Kids & Canapes Grid */}
                                    <div className="grid md:grid-cols-3 gap-6">
                                        <Card className="p-6">

                                                    <button onClick={() => updateWeddingData({ eventDetails: { ...eventDetails, hasVegGuests: false } })} className={`px-4 py-2 rounded-lg border text-sm transition-all ${eventDetails.hasVegGuests === false ? 'bg-stone-500 text-white border-stone-500' : 'bg-white text-stone-600 border-stone-200 hover:border-stone-300'}`} disabled={eventDetails.isSubmitted}>No</button>
                                                </div>
                                                {eventDetails.hasVegGuests && <div className="bg-amber-50 text-amber-800 p-4 rounded-lg text-sm border border-amber-200 flex items-start gap-2"><AlertCircle size={18} className="mt-0.5 shrink-0" /><span>Please note: One of your 3 selections for each course <strong>must</strong> be vegetarian.</span></div>}

                                        </Card>
                                        <Card className="p-6">
                                            <h3 className="font-serif font-bold text-xl mb-4 text-stone-800 flex items-center gap-2"><Baby size={20}/> Children?</h3>
                                            <div className="space-y-4">
                                                <p className="text-stone-700 font-medium text-sm">Children attending?</p>
                                                <div className="flex gap-4">
                                                    <button onClick={() => updateWeddingData({ eventDetails: { ...eventDetails, hasChildren: true } })} className={`px-4 py-2 rounded-lg border text-sm transition-all ${eventDetails.hasChildren === true ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-stone-600 border-stone-200 hover:border-rose-300'}`} disabled={eventDetails.isSubmitted}>Yes</button>
                                                    <button onClick={() => updateWeddingData({ eventDetails: { ...eventDetails, hasChildren: false } })} className={`px-4 py-2 rounded-lg border text-sm transition-all ${eventDetails.hasChildren === false ? 'bg-stone-500 text-white border-stone-500' : 'bg-white text-stone-600 border-stone-200 hover:border-stone-300'}`} disabled={eventDetails.isSubmitted}>No</button>
                                                </div>
                                            </div>
                                        </Card>
                                        <Card className="p-6">
                                            <h3 className="font-serif font-bold text-xl mb-4 text-stone-800 flex items-center gap-2"><Coffee size={20}/> Canapes?</h3>
                                            <div className="space-y-4">
                                                <p className="text-stone-700 font-medium text-sm">Serving canapes?</p>
                                                <div className="flex gap-4">
                                                    <button onClick={() => updateWeddingData({ eventDetails: { ...eventDetails, hasCanapes: true } })} className={`px-4 py-2 rounded-lg border text-sm transition-all ${eventDetails.hasCanapes === true ? 'bg-rose-500 text-white border-rose-500' : 'bg-white text-stone-600 border-stone-200 hover:border-rose-300'}`} disabled={eventDetails.isSubmitted}>Yes</button>
                                                    <button onClick={() => updateWeddingData({ eventDetails: { ...eventDetails, hasCanapes: false } })} className={`px-4 py-2 rounded-lg border text-sm transition-all ${eventDetails.hasCanapes === false ? 'bg-stone-500 text-white border-stone-500' : 'bg-white text-stone-600 border-stone-200 hover:border-stone-300'}`} disabled={eventDetails.isSubmitted}>No</button>
                                                </div>
                                            </div>
                                        </Card>
                                    </div>
                                    
                                    {eventDetails.hasChildren && (
                                        <Card className="p-6 border-l-4 border-l-blue-400 bg-blue-50/50 animate-in fade-in">
                                            <h3 className="font-serif font-bold text-xl mb-4 text-blue-800 flex items-center gap-2"><Baby size={24}/> Children's Menu</h3>
                                            <MenuSection title="Kids Starter (Select 1)" items={SHARED_MENUS.kids.starters} selectedItems={menuSelections.kidsStarters} limit={1} onToggle={(item, limit) => toggleMenuSelection('kidsStarters', item, limit)} isLocked={eventDetails.isSubmitted}/>
                                            <div className="h-px bg-blue-200 my-4" />
                                            <MenuSection title="Kids Main (Select 1)" items={SHARED_MENUS.kids.mains} selectedItems={menuSelections.kidsMains} limit={1} onToggle={(item, limit) => toggleMenuSelection('kidsMains', item, limit)} isLocked={eventDetails.isSubmitted}/>
                                            <div className="h-px bg-blue-200 my-4" />
                                            <MenuSection title="Kids Dessert (Select 1)" items={SHARED_MENUS.kids.desserts} selectedItems={menuSelections.kidsDesserts} limit={1} onToggle={(item, limit) => toggleMenuSelection('kidsDesserts', item, limit)} isLocked={eventDetails.isSubmitted}/>
                                        </Card>
                                    )}

                                    {eventDetails.hasCanapes && (
                                        <Card className="p-6 animate-in fade-in"><h3 className="font-serif font-bold text-xl mb-4 flex items-center gap-2"><Coffee size={20} className="text-rose-400"/> Canapes (Select 3)</h3><MenuSection title="Available Canapes" items={MENUS[eventDetails.venue].canapes} selectedItems={menuSelections.canapes} limit={3} onToggle={(item, limit) => toggleMenuSelection('canapes', item, limit)} isLocked={eventDetails.isSubmitted}/></Card>
                                    )}

                                    <Card className="p-6"><h3 className="font-serif font-bold text-xl mb-4 flex items-center gap-2"><Utensils size={20} className="text-rose-400"/> Wedding Breakfast (Select 3 per course)</h3><MenuSection title="Starters" items={MENUS[eventDetails.venue].starters} selectedItems={menuSelections.starters} limit={3} onToggle={(item, limit) => toggleMenuSelection('starters', item, limit)} isLocked={eventDetails.isSubmitted}/><div className="h-px bg-stone-100 my-4" /><MenuSection title="Mains" items={MENUS[eventDetails.venue].mains} selectedItems={menuSelections.mains} limit={3} onToggle={(item, limit) => toggleMenuSelection('mains', item, limit)} isLocked={eventDetails.isSubmitted}/><div className="h-px bg-stone-100 my-4" /><MenuSection title="Desserts" items={MENUS[eventDetails.venue].desserts} selectedItems={menuSelections.desserts} limit={3} onToggle={(item, limit) => toggleMenuSelection('desserts', item, limit)} isLocked={eventDetails.isSubmitted}/></Card>
                                    <Card className="p-6"><h3 className="font-serif font-bold text-xl mb-4 flex items-center gap-2"><Pizza size={20} className="text-rose-400"/> Evening Food</h3><div className="mb-4"><Select disabled={eventDetails.isSubmitted} label="Choose 1 Package" value={menuSelections.eveningCategory} onChange={(e) => { const newVal = e.target.value; setMenuSelections({...menuSelections, eveningCategory: newVal, eveningPizzas: [], eveningSides: [], eveningStreetFood: []}); updateWeddingData({ menuSelections: {...menuSelections, eveningCategory: newVal, eveningPizzas: [], eveningSides: [], eveningStreetFood: []} }); }}><option value="">Select Package...</option>{SHARED_MENUS.evening.map(opt => <option key={opt.name} value={opt.name}>{opt.name}</option>)}</Select></div>{menuSelections.eveningCategory === "Woodfired Pizzas" && <MenuSection title="Select 3 Pizza Toppings" items={SHARED_MENUS.evening.find(e => e.name === "Woodfired Pizzas").items} selectedItems={menuSelections.eveningPizzas} limit={3} onToggle={(item, limit) => toggleMenuSelection('eveningPizzas', item, limit)} isLocked={eventDetails.isSubmitted}/>}{menuSelections.eveningCategory === "Hog Roast" && <MenuSection title="Select Additional Sides (£3 each)" items={SHARED_MENUS.evening.find(e => e.name === "Hog Roast").extraItems} selectedItems={menuSelections.eveningSides} limit={4} onToggle={(item, limit) => toggleMenuSelection('eveningSides', item, limit)} isLocked={eventDetails.isSubmitted}/>}{menuSelections.eveningCategory === "Street Food" && <MenuSection title="Select 2 Street Food Options" items={SHARED_MENUS.evening.find(e => e.name === "Street Food").items} selectedItems={menuSelections.eveningStreetFood} limit={2} onToggle={(item, limit) => toggleMenuSelection('eveningStreetFood', item, limit)} isLocked={eventDetails.isSubmitted}/>}{menuSelections.eveningCategory && menuSelections.eveningCategory !== "Woodfired Pizzas" && menuSelections.eveningCategory !== "Street Food" && <div className="bg-stone-50 p-4 rounded text-sm text-stone-600"><strong>Included:</strong> {SHARED_MENUS.evening.find(e => e.name === menuSelections.eveningCategory)?.items.join(", ")}</div>}</Card>
                                </div>
                            )}

                            {/* TOTALS VIEW */}
                            {view === 'totals' && (
                                <div className="space-y-6 max-w-5xl">
                                    <div className="flex flex-col md:flex-row gap-6">
                                        <Card className="p-6 bg-rose-50 border-rose-100 flex-1 flex flex-col justify-center items-center text-center">
                                            <h3 className="text-rose-800 font-bold uppercase tracking-widest text-xs mb-2">Days to Submit Final Numbers</h3>
                                            {eventDetails.isSubmitted ? (
                                                <div className="flex flex-col items-center"><CheckCircle size={48} className="text-green-500 mb-2"/><span className="text-xl font-serif font-bold text-green-700">Submitted</span><span className="text-sm text-green-600">{new Date(eventDetails.submissionDate).toLocaleDateString()}</span></div>
                                            ) : (
                                                <><span className="text-4xl font-serif font-bold text-rose-500">{stats.daysToDeadline}</span><span className="text-sm text-rose-700 font-medium">Days Left</span><span className="text-xs text-rose-400 mt-2">Deadline: {stats.deadlineDateStr}</span></>
                                            )}
                                        </Card>
                                        <Card className="p-6 flex-[2]"><h3 className="font-serif font-bold text-xl mb-4 flex items-center gap-2 text-amber-600"><AlertCircle size={20}/> Dietary Requirements</h3><div className="bg-amber-50 rounded-lg p-4 border border-amber-100 h-full max-h-60 overflow-y-auto">{stats.dietary.length > 0 ? (<ul className="space-y-3">{stats.dietary.map(guest => (<li key={guest.id} className="text-sm border-b border-amber-100 last:border-0 pb-2 last:pb-0"><div className="font-bold text-amber-900">{guest.name}</div><div className="flex flex-wrap gap-1 mt-1">{guest.isVegan && <span className="text-[10px] bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-bold">VEGAN</span>}{guest.dietary && <span className="text-stone-600">{guest.dietary}</span>}</div></li>))}</ul>) : <p className="text-amber-800 text-sm italic">No specific dietary requirements recorded.</p>}</div></Card>
                                    </div>
                                    <Card className="p-6"><h3 className="font-serif font-bold text-xl mb-4 flex items-center gap-2"><ChefHat size={20} className="text-rose-400"/> Menu Breakdown</h3><div className="grid md:grid-cols-3 gap-6"><div><h4 className="font-bold text-stone-700 mb-2 border-b border-stone-100 pb-1">Starters</h4>{Object.entries(stats.starters).length > 0 ? Object.entries(stats.starters).map(([name, count]) => <StatRow key={name} label={name} count={count} />) : <p className="text-sm text-stone-400 italic">None selected.</p>}</div><div><h4 className="font-bold text-stone-700 mb-2 border-b border-stone-100 pb-1">Mains</h4>{Object.entries(stats.mains).length > 0 ? Object.entries(stats.mains).map(([name, count]) => <StatRow key={name} label={name} count={count} />) : <p className="text-sm text-stone-400 italic">None selected.</p>}</div><div><h4 className="font-bold text-stone-700 mb-2 border-b border-stone-100 pb-1">Desserts</h4>{Object.entries(stats.desserts).length > 0 ? Object.entries(stats.desserts).map(([name, count]) => <StatRow key={name} label={name} count={count} />) : <p className="text-sm text-stone-400 italic">None selected.</p>}</div></div></Card>
                                    <Card className="p-8 border-t-4 border-t-rose-400"><h3 className="font-serif font-bold text-2xl mb-2 flex items-center gap-2"><PenTool size={24} className="text-rose-500"/> Final Submission</h3><p className="text-stone-500 mb-6 text-sm">Please sign below to confirm final numbers. Once submitted, event is locked.</p><div className="space-y-4"><div className="border-2 border-dashed border-stone-300 rounded-lg bg-stone-50 p-4 flex flex-col items-center justify-center relative">{eventDetails.isSubmitted && eventDetails.signature ? (<img src={eventDetails.signature} alt="Signature" className="max-h-32" />) : (<><canvas ref={canvasRef} onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={stopDrawing} width={500} height={150} className="w-full max-w-lg h-32 bg-white rounded border border-stone-200 cursor-crosshair touch-none" /><div className="absolute bottom-2 right-2 text-xs text-stone-400 pointer-events-none">Sign here</div></>)}</div>{!eventDetails.isSubmitted && (<div className="flex justify-between items-center"><button onClick={clearSignature} className="text-sm text-stone-500 hover:text-red-500 underline">Clear Signature</button><Button onClick={handleSubmitNumbers} icon={CheckCircle}>Confirm & Submit</Button></div>)}</div></Card>
                                </div>
                            )}

                            {/* GUESTS & SEATING & SETTINGS */}
                            {view === 'guests' && (
                                <Card className="overflow-hidden"><div className="overflow-x-auto"><table className="w-full text-left border-collapse"><thead><tr className="bg-stone-50 border-b border-stone-200 text-xs font-semibold text-stone-500 uppercase tracking-wider"><th className="p-4">Name</th><th className="p-4">Status</th><th className="p-4 hidden md:table-cell">Menu</th><th className="p-4 hidden md:table-cell">Table</th><th className="p-4 text-right">Actions</th></tr></thead><tbody className="divide-y divide-stone-100">{guests.map(guest => (<tr key={guest.id} className="hover:bg-stone-50 transition-colors group"><td className="p-4"><div className="font-medium text-stone-800">{guest.name}</div><div className="flex gap-1 mt-1">{guest.isChild && <span className="text-[10px] bg-blue-50 text-blue-600 px-1.5 rounded">Child</span>}{guest.isVegan && <span className="text-[10px] bg-green-50 text-green-600 px-1.5 rounded">Vegan</span>}{guest.dietary && <span className="text-[10px] bg-amber-50 text-amber-600 px-1.5 rounded">{guest.dietary}</span>}</div></td><td className="p-4"><span className={`px-2 py-1 rounded-full text-xs font-semibold ${guest.rsvp === 'attending' ? 'bg-green-100 text-green-700' : guest.rsvp === 'declined' ? 'bg-red-50 text-red-600' : 'bg-stone-100 text-stone-600'}`}>{guest.rsvp}</span></td><td className="p-4 hidden md:table-cell text-sm text-stone-600">{guest.rsvp === 'attending' ? <div className="space-y-0.5">{guest.starter && <div className="truncate w-48" title={guest.starter}>S: {guest.starter}</div>}{guest.main && <div className="truncate w-48" title={guest.main}>M: {guest.main}</div>}{guest.dessert && <div className="truncate w-48" title={guest.dessert}>D: {guest.dessert}</div>}</div> : '-'}</td><td className="p-4 hidden md:table-cell text-sm">{tables.find(t => t.id === guest.tableId)?.name || <span className="text-stone-400 italic">Unseated</span>}</td><td className="p-4 text-right"><div className="flex justify-end gap-2"><button onClick={() => { setEditingGuest(guest); setIsGuestModalOpen(true); }} className="text-stone-400 hover:text-blue-500 p-1"><CheckSquare size={16} /></button><button onClick={() => { if(confirm('Delete?')) { const newG = guests.filter(g => g.id !== guest.id); setGuests(newG); updateWeddingData({ guests: newG }); } }} className="text-stone-400 hover:text-red-500 p-1"><Trash2 size={16} /></button></div></td></tr>))}{guests.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-stone-400">No guests yet.</td></tr>}</tbody></table></div></Card>
                            )}
                            {view === 'seating' && (
                                <div className="space-y-6"><div className="flex justify-between items-center bg-blue-50 p-4 rounded-lg border border-blue-100"><div className="text-sm text-blue-800"><span className="font-bold">{guests.filter(g => g.rsvp === 'attending' && !g.tableId).length}</span> guests need seats.</div><Button variant="secondary" onClick={() => { setModalInputName(""); setIsTableModalOpen(true); }} icon={Plus}>Add Table</Button></div><div className="grid lg:grid-cols-2 gap-8">{tables.map(table => { const seatedGuests = guests.filter(g => g.tableId === table.id); const isFull = seatedGuests.length >= table.seats; return (<Card key={table.id} className="p-6 relative"><div className="flex justify-between items-center mb-4"><h3 className="font-serif font-bold text-lg">{table.name}</h3><span className="text-xs text-stone-500 bg-stone-100 px-2 py-1 rounded-full">{seatedGuests.length}/{table.seats}</span></div><div className="flex justify-center mb-6"><div className={`bg-stone-200 border-4 border-white shadow-inner flex items-center justify-center text-stone-400 font-bold ${table.shape === 'round' ? 'w-32 h-32 rounded-full' : 'w-48 h-24 rounded-lg'}`}>{table.id}</div></div><div className="grid grid-cols-2 gap-2">{seatedGuests.map(guest => (<div key={guest.id} className="flex items-center justify-between bg-rose-50 p-2 rounded text-sm border border-rose-100"><div className="truncate text-rose-900 w-24">{guest.name}</div><button onClick={() => { const newG = guests.map(g => g.id === guest.id ? { ...g, tableId: null } : g); setGuests(newG); updateWeddingData({ guests: newG }); }} className="text-rose-400 hover:text-rose-600"><X size={14} /></button></div>))}{!isFull && (<div className="col-span-2 mt-2"><select className="w-full text-sm p-2 border border-stone-200 rounded-lg bg-white" onChange={(e) => { if(!e.target.value) return; const newG = guests.map(g => g.id === parseInt(e.target.value) ? { ...g, tableId: table.id } : g); setGuests(newG); updateWeddingData({ guests: newG }); }} value=""><option value="">+ Assign Guest</option>{guests.filter(g => g.rsvp === 'attending' && !g.tableId).map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select></div>)}</div><button onClick={() => { const newT = tables.filter(t => t.id !== table.id); setTables(newT); updateWeddingData({ tables: newT }); }} className="absolute top-4 right-4 text-stone-300 hover:text-red-400"><Trash2 size={16} /></button></Card>); })}</div></div>
                            )}
                            {view === 'settings' && (
                                <div className="max-w-2xl mx-auto space-y-6"><Card className="p-8"><h3 className="font-serif font-bold text-2xl mb-6 pb-4 border-b border-stone-100">Event Settings</h3><div className="grid md:grid-cols-2 gap-4"><Input label="Partner 1 Name" value={eventDetails.partner1} onChange={(e) => { const newVal = e.target.value; setEventDetails({...eventDetails, partner1: newVal}); updateWeddingData({ eventDetails: {...eventDetails, partner1: newVal} }); }} /><Input label="Partner 2 Name" value={eventDetails.partner2} onChange={(e) => { const newVal = e.target.value; setEventDetails({...eventDetails, partner2: newVal}); updateWeddingData({ eventDetails: {...eventDetails, partner2: newVal} }); }} /><div className="col-span-2"><Input type="date" label="Wedding Date" value={eventDetails.date} onChange={(e) => { const newVal = e.target.value; setEventDetails({...eventDetails, date: newVal}); updateWeddingData({ eventDetails: {...eventDetails, date: newVal} }); }} /></div></div></Card></div>
                            )}

                           {/* --- MODALS --- */}
                           <Modal
                             isOpen={isGuestModalOpen}
                             onClose={() => { setIsGuestModalOpen(false); setEditingGuest(null); }}
                             title={editingGuest?.id ? "Edit Guest" : "Add Guest"}
                           >
                             <div className="space-y-3">
                               <Input
                                 label="Guest Name"
                                 value={editingGuest?.name || ""}
                                 onChange={(e) => setEditingGuest({ ...editingGuest, name: e.target.value })}
                                 placeholder="e.g. Alex Jarvis"
                                 disabled={eventDetails.isSubmitted}
                               />

                               <Select
                                 label="RSVP"
                                 value={editingGuest?.rsvp || "pending"}
                                 onChange={(e) => setEditingGuest({ ...editingGuest, rsvp: e.target.value })}
                                 disabled={eventDetails.isSubmitted}
                               >
                                 <option value="pending">pending</option>
                                 <option value="attending">attending</option>
                                 <option value="declined">declined</option>
                               </Select>

                               {/* Dynamic Menu Selection for Guests */}
                               {editingGuest?.rsvp === 'attending' && (
                                    <div className="space-y-3 p-3 bg-stone-50 rounded-lg border border-stone-100 animate-in fade-in">
                                        <h4 className="font-serif font-bold text-stone-700 text-sm">Menu Choices</h4>
                                        {(() => {
                                            let availableStarters = [], availableMains = [], availableDesserts = [];
                                            
                                            if (editingGuest.isChild) {
                                                if (menuSelections.kidsStarters && menuSelections.kidsStarters.length > 0) {
                                                     availableStarters = menuSelections.kidsStarters;
                                                     availableMains = menuSelections.kidsMains;
                                                     availableDesserts = menuSelections.kidsDesserts;
                                                } else {
                                                    availableStarters = SHARED_MENUS.kids.starters;
                                                    availableMains = SHARED_MENUS.kids.mains;
                                                    availableDesserts = SHARED_MENUS.kids.desserts;
                                                }
                                            } else if (editingGuest.isVegan) {
                                                availableStarters = SHARED_MENUS.vegan.starters;
                                                availableMains = SHARED_MENUS.vegan.mains;
                                                availableDesserts = SHARED_MENUS.vegan.desserts;
                                            } else {
                                                availableStarters = menuSelections.starters;
                                                availableMains = menuSelections.mains;
                                                availableDesserts = menuSelections.desserts;
                                            }

                                            if (availableStarters.length === 0 && !editingGuest.isVegan && !editingGuest.isChild) {
                                                return <div className="text-xs text-amber-600">Please configure the menu options in the "Menu Options" tab first.</div>;
                                            }

                                            return (
                                                <>
                                                    <Select label="Starter" value={editingGuest.starter || ""} onChange={(e) => setEditingGuest({...editingGuest, starter: e.target.value})} disabled={eventDetails.isSubmitted}><option value="">Select Starter...</option>{availableStarters.map((item, i) => <option key={i} value={item}>{item}</option>)}</Select>
                                                    <Select label="Main" value={editingGuest.main || ""} onChange={(e) => setEditingGuest({...editingGuest, main: e.target.value})} disabled={eventDetails.isSubmitted}><option value="">Select Main...</option>{availableMains.map((item, i) => <option key={i} value={item}>{item}</option>)}</Select>
                                                    <Select label="Dessert" value={editingGuest.dessert || ""} onChange={(e) => setEditingGuest({...editingGuest, dessert: e.target.value})} disabled={eventDetails.isSubmitted}><option value="">Select Dessert...</option>{availableDesserts.map((item, i) => <option key={i} value={item}>{item}</option>)}</Select>
                                                </>
                                            );
                                        })()}
                                    </div>
                               )}

                               <Input
                                 label="Dietary Requirements"
                                 value={editingGuest?.dietary || ""}
                                 onChange={(e) => setEditingGuest({ ...editingGuest, dietary: e.target.value })}
                                 placeholder="e.g. nut allergy"
                                 disabled={eventDetails.isSubmitted}
                               />

                               <div className="grid grid-cols-2 gap-3">
                                 <label className="flex items-center gap-2 text-sm text-stone-700">
                                   <input
                                     type="checkbox"
                                     checked={!!editingGuest?.isChild}
                                     onChange={(e) => setEditingGuest({ ...editingGuest, isChild: e.target.checked })}
                                     disabled={eventDetails.isSubmitted}
                                     className="rounded text-rose-500 focus:ring-rose-400"
                                   />
                                   Child
                                 </label>

                                 <label className="flex items-center gap-2 text-sm text-stone-700">
                                   <input
                                     type="checkbox"
                                     checked={!!editingGuest?.isVegan}
                                     onChange={(e) => setEditingGuest({ ...editingGuest, isVegan: e.target.checked })}
                                     disabled={eventDetails.isSubmitted}
                                     className="rounded text-rose-500 focus:ring-rose-400"
                                   />
                                   Vegan
                                 </label>
                               </div>

                               <div className="flex justify-end gap-2 pt-2">
                                 <Button variant="secondary" onClick={() => { setIsGuestModalOpen(false); setEditingGuest(null); }}>
                                   Cancel
                                 </Button>
                                 <Button onClick={saveGuest} disabled={eventDetails.isSubmitted || !(editingGuest?.name || "").trim()}>
                                   Save Guest
                                 </Button>
                               </div>
                             </div>
                           </Modal>

                           <Modal isOpen={isTableModalOpen} onClose={() => setIsTableModalOpen(false)} title="Add New Table">
                              <Input autoFocus label="Table Name" placeholder="e.g. Table 1" value={modalInputName} onChange={(e) => setModalInputName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAddTable()} />
                              <div className="flex justify-end gap-2 mt-4"><Button variant="secondary" onClick={() => setIsTableModalOpen(false)}>Cancel</Button><Button onClick={handleAddTable}>Add Table</Button></div>
                           </Modal>
                           
                           <Modal
                             isOpen={isBulkAddModalOpen}
                             onClose={() => setIsBulkAddModalOpen(false)}
                             title="Bulk Add Guests"
                           >
                             <div className="space-y-3">
                               <div className="text-sm text-stone-600">
                                 Paste one guest per line.
                               </div>

                               <textarea
                                 className="w-full h-48 px-3 py-2 rounded-lg border border-stone-200 focus:border-rose-300 focus:ring-2 focus:ring-rose-100 outline-none transition-all"
                                 value={bulkGuestsInput}
                                 onChange={(e) => setBulkGuestsInput(e.target.value)}
                                 placeholder={"John Smith\nJane Smith\nSam Jones"}
                                 disabled={eventDetails.isSubmitted}
                               />

                               <div className="flex justify-end gap-2 pt-2">
                                 <Button variant="secondary" onClick={() => setIsBulkAddModalOpen(false)}>
                                   Cancel
                                 </Button>
                                 <Button onClick={handleBulkAdd} disabled={eventDetails.isSubmitted || !bulkGuestsInput.trim()}>
                                   Add Guests
                                 </Button>
                               </div>
                             </div>
                           </Modal>

                            {showSaveNotification && <div className="fixed bottom-4 right-4 bg-stone-800 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 animate-in slide-in-from-bottom-5 fade-in z-50"><div className="bg-green-500 rounded-full p-0.5"><CheckSquare size={14} className="text-white" /></div><span className="font-medium text-sm">Changes Saved Successfully!</span></div>}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeddingPlannerApp />);
    </script>
</body>
</html>
